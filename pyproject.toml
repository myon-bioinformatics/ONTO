[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onto-shared"
version = "0.1.0"
description = "Shared vocabulary checks and directed graph operations"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.optional-dependencies]
exchange = ["rdflib>=7", "neo4j>=5"]

[project.scripts]
onto = "onto_cli:main"

[tool.setuptools]
py-modules = ["ontology", "knowledgegraph", "onto_cli"]
packages = ["onto_shared"]
