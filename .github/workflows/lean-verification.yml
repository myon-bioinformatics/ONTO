name: Lean verification

on:
  pull_request:
    paths:
      - "formal/**"
      - "ontology.py"
      - "tests/test_formal_graph_projection.py"
      - ".github/workflows/lean-verification.yml"
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "ontology.py"
      - "tests/test_formal_graph_projection.py"
      - ".github/workflows/lean-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  graph-projection:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-lean-verify.yml@6c2558c4251698c50bc07bad86fb49f902b2738f
    with:
      project-directory: formal
      proof: GraphProjection.lean
      theorems: |
        Onto.relationship_injective
        Onto.relationship_membership
        Onto.node_membership
        Onto.endpoints_present
        Onto.graph_equivalence_iff
        Onto.parallel_predicates_preserved
