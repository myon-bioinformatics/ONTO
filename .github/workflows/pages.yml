name: Pages

# Publishes the usage guide: docs/guide.page.json (a web-ui-page/1 spec, data only, with 🎞 GIF demo / 🧩 features
# tabs). The parent's reusable workflow renders it with the PySaiyanWeBoo commit pinned there — no HTML, CSS or JS
# lives in this repository. Pull requests build the page (an invalid spec fails there); only main deploys.
on:
  push:
    branches: [main]
    paths:
      - "docs/guide.page.json"
      - "docs/guide.features.json"
      - "onto_cli.py"
      - "ontology.py"
      - "knowledgegraph.py"
      - "mottainai.py"
      - "tests/test_link_gaps.py"
      - "examples/mottainai/evidence-links.json"
      - "onto_shared/**"
      - "pyproject.toml"
      - "docs/assets/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/guide.page.json"
      - "docs/guide.features.json"
      - "onto_cli.py"
      - "ontology.py"
      - "knowledgegraph.py"
      - "mottainai.py"
      - "tests/test_link_gaps.py"
      - "examples/mottainai/evidence-links.json"
      - "onto_shared/**"
      - "pyproject.toml"
      - "docs/assets/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@main
    with:
      artifact_path: _site
      guide_page: docs/guide.page.json
      guide_features_config: docs/guide.features.json
      guide_assets: >-
        docs/assets/repository-concept.jpg=overview.jpg
        docs/assets/graphs.gif=demos/graphs.gif
      guide_brand: ONTO   # ♻️ icon and favicon from CaChereCyCle (ONTO.icon / ONTO.favicon)
