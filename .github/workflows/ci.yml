name: Shared Python API
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  consumer:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python }}
      - name: Standard-library tests
        run: uv run --no-project python -S -m unittest discover -s tests -v
      - run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
          cd "$RUNNER_TEMP"
          uv venv consumer
          uv pip install --python consumer/bin/python --no-deps wheels/*.whl
          consumer/bin/python -I "$GITHUB_WORKSPACE/examples/shared_taxonomy.py"
          consumer/bin/onto --help
          consumer/bin/onto exchange --help
          consumer/bin/onto versions --json
          consumer/bin/onto otl --help
      - name: Query RDF using the optional graph module
        run: |
          cd "$RUNNER_TEMP"
          uv pip install --python consumer/bin/python "$(ls wheels/*.whl)[exchange]"
          echo '<urn:A> <urn:narrower> <urn:B> .' > sample.nt
          consumer/bin/python -I -m ontology query sample.nt 'SELECT ?x WHERE { <urn:A> <urn:narrower> ?x }' > direct-answer.json
          consumer/bin/onto exchange query sample.nt 'SELECT ?x WHERE { <urn:A> <urn:narrower> ?x }' > answer.json
          cmp direct-answer.json answer.json
          consumer/bin/python -I -c 'import json; assert json.load(open("answer.json"))["results"]["bindings"] == [{"x": {"type": "uri", "value": "urn:B"}}]'
          consumer/bin/python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests"
      - name: Check installed ONTO delegation to OTL entailment
        run: |
          cd "$RUNNER_TEMP"
          printf '%s\n' '{"premises":[["OR",["NOT","cat"],"mammal"],"cat"],"conclusion":"mammal"}' > entails-input.json
          consumer/bin/onto otl entails - < entails-input.json > entails.json
          consumer/bin/onto otl entails - --ttl < entails-input.json > entails.ttl
          consumer/bin/python -I - <<'PY'
          import json
          from pathlib import Path
          from rdflib import Graph, Namespace, RDF

          result = json.loads(Path("entails.json").read_text())
          assert result == {"verdict": "entailed", "atoms": ["cat", "mammal"], "counterexample": None}

          ot = Namespace("urn:otl:")
          graph = Graph().parse("entails.ttl", format="turtle")
          check, = graph.subjects(RDF.type, ot.InferenceCheck)
          assert set(graph.objects(check, ot.verdict)) == {ot.entailed}
          assert len(set(graph.objects(check, ot.premise))) == 2
          conclusion, = graph.objects(check, ot.conclusion)
          assert json.loads(str(graph.value(conclusion, ot.rule))) == "mammal"
          PY
